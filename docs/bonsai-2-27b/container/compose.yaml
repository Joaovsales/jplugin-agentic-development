# Hardened Bonsai llama-server on the NATIVE Docker engine (context "default",
# unix:///var/run/docker.sock), not the Docker Desktop VM. See ../README.md § Container.
#
#   docker --context default compose -f docs/bonsai-2-27b/container/compose.yaml up -d --build
#
# Model selection (host directory mounted read-only at /models):
#   BONSAI_MODEL_DIR   default ~/models/bonsai-27b-v1     (directory on the host)
#   BONSAI_MODEL_FILE  default Bonsai-27B-Q1_0.gguf       (file inside that directory)
# Fast alternative: BONSAI_MODEL_DIR=~/models/bonsai2-9b BONSAI_MODEL_FILE=Ternary-Bonsai-2-9B-Q2_0.gguf
#
# Network shape: llama sits only on `sealed`, an internal network with no route off it, so the
# server has no egress. Docker publishes no ports from an internal network, so `relay` (socat,
# no GPU, no model, fixed target) joins `sealed` and `edge` and is the only published port.
name: bonsai

services:
  llama:
    build:
      context: .
    image: bonsai-llama:b12420
    environment:
      LLAMA_ARG_MODEL: /models/${BONSAI_MODEL_FILE:-Bonsai-27B-Q1_0.gguf}
    volumes:
      - type: bind
        source: ${BONSAI_MODEL_DIR:-~/models/bonsai-27b-v1}
        target: /models
        read_only: true
    networks: [sealed]   # internal only: no egress, no published port
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 8g          # must stay well above --cache-ram 4096 (Dockerfile ENTRYPOINT)
    memswap_limit: 8g
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  relay:
    # socat 1.8.0.3, pinned by digest: a re-pushed tag cannot change what runs here.
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    # Fixed target: whatever connects can reach llama:8080 and nothing else.
    command: ["TCP-LISTEN:8080,fork,reuseaddr", "TCP:llama:8080"]
    networks: [sealed, edge]
    ports:
      - "127.0.0.1:${BONSAI_PORT:-18080}:8080"   # loopback only — never 0.0.0.0
    depends_on: [llama]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    memswap_limit: 64m
    restart: unless-stopped

networks:
  sealed:
    internal: true
  edge: {}
