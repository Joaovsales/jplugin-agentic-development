<!doctype html>
<!-- A web page with planted lab-trace costs, for the /perf end-to-end audit:
     a 120 ms long task before first paint, a late banner that shifts the
     layout, and a button whose handler blocks the main thread for 150 ms. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shop fixture</title>
  <style>
    body { font: 16px/1.4 sans-serif; margin: 0; }
    h1 { font-size: 3rem; margin: 1rem; }
    .banner { background: #fd4; padding: 2rem; }
  </style>
</head>
<body>
  <main>
    <h1>Shop fixture</h1>
    <p id="hero">Every product, one page. This paragraph is the largest text block on first render.</p>
    <button id="add">Add to cart</button>
    <p id="status">Cart: 0</p>
  </main>
  <script>
    const block = (ms) => { const end = performance.now() + ms; while (performance.now() < end) {} };
    block(120);
    setTimeout(() => {
      const banner = document.createElement('div');
      banner.className = 'banner';
      banner.textContent = 'Free shipping today';
      document.body.prepend(banner);
    }, 300);
    let count = 0;
    document.getElementById('add').addEventListener('click', () => {
      block(150);
      document.getElementById('status').textContent = `Cart: ${++count}`;
    });
  </script>
</body>
</html>
