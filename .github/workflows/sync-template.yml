name: Sync jplugin-agentic-development (reusable)

# Reusable workflow: called by downstream project repos to vendor the
# template-managed workflow files (skills, agents, hooks, the AGENTS.md managed
# block and the CLAUDE.md pointer) from the
# public jplugin-agentic-development repo, opening a PR with any changes.
#
# Managed (overwritten/added, never deleted): the AGENTS.md managed block,
#   CLAUDE.md (the @AGENTS.md pointer), .agents/skills/, .agents/references/,
#   .claude/agents/, .claude/hooks/, .claude/settings.json
# Retired (not mirrored; /sync deletes the copies, this workflow never deletes): .claude/skills/
# Preserved (never touched): AGENTS.md below the end marker, CLAUDE.local.md

on:
  workflow_call:
    inputs:
      template_ref:
        description: "Ref of jplugin-agentic-development to sync from"
        type: string
        default: "master"
      auto_merge:
        description: "Auto-merge the sync PR once required checks pass"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo (default branch)
        uses: actions/checkout@v4

      - name: Fetch template (public, no auth)
        id: fetch
        run: |
          set -euo pipefail
          rm -rf .tpl-sync
          git clone --depth 1 --branch "${{ inputs.template_ref }}" \
            https://github.com/Joaovsales/jplugin-agentic-development .tpl-sync
          echo "sha=$(git -C .tpl-sync rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Apply managed paths (non-destructive; preserve project files)
        run: |
          set -euo pipefail
          T=.tpl-sync
          # Overwrite + add from template. No --delete: an auto-merged PR must
          # never silently remove a repo-local file.
          mirror() {
            if [ -d "$T/$1" ]; then
              mkdir -p "$1"
              rsync -a "$T/$1/" "$1/"
            fi
          }
          mirror ".agents/skills"
          mirror ".agents/references"
          mirror ".claude/agents"
          mirror ".claude/hooks"
          if [ -f "$T/.claude/settings.json" ]; then
            mkdir -p .claude
            cp "$T/.claude/settings.json" ".claude/settings.json"
          fi
          # AGENTS.md and CLAUDE.md are written through the managed-block script,
          # never copied: the project's text below the end marker survives
          # byte-for-byte, and the pointer lands in the same run as the block.
          python3 "$T/.agents/skills/sync/scripts/sync-managed-block.py" \
            --source "$T/AGENTS.md" --target AGENTS.md --claude-md CLAUDE.md
          # Preserved, never touched: AGENTS.md below the end marker, CLAUDE.local.md
          rm -rf "$T"

      - name: Create or update sync PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-jplugin-agentic-development
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          commit-message: "chore(workflow): sync jplugin-agentic-development@${{ steps.fetch.outputs.sha }}"
          title: "chore: sync jplugin-agentic-development template"
          body: |
            Automated sync of the template-managed workflow files from
            [jplugin-agentic-development@${{ inputs.template_ref }}](https://github.com/Joaovsales/jplugin-agentic-development/tree/${{ inputs.template_ref }})
            (`${{ steps.fetch.outputs.sha }}`).

            **Managed (overwritten/added):** the `AGENTS.md` managed block, `CLAUDE.md` (the `@AGENTS.md` pointer), `.agents/skills/`, `.agents/references/`, `.claude/agents/`, `.claude/hooks/`, `.claude/settings.json`
            **Retired (not mirrored — run `/sync` in the project to delete the copies):** `.claude/skills/`
            **Preserved (untouched):** `AGENTS.md` below the end marker, `CLAUDE.local.md`

            Files are added/overwritten but never deleted. Generated by the reusable sync workflow.

      - name: Enable auto-merge when green
        if: ${{ inputs.auto_merge && steps.cpr.outputs.pull-request-number }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"
